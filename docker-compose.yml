services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fileshield}
      POSTGRES_USER: ${POSTGRES_USER:-fileshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fileshield}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    # SECRET_KEY, SUPER_ADMIN_PASSWORD, CORS_ORIGINS etc. come from here -
    # required now (no insecure defaults in config.py), and .dockerignore
    # already keeps this file out of the built image itself.
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fileshield}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-fileshield}
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # No curl/wget in this image - urllib is stdlib, needs no extra install.
    # Lets frontend/nginx below wait for the backend to actually be ready
    # to serve requests, not just for its container to have started -
    # confirmed empirically that without this, there's a several-second
    # window after a fresh boot where nginx is up and serving the frontend
    # but every API call 502s because the backend isn't listening yet.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fileshield}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-fileshield}
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - db
      - redis
      - backend
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    # -B embeds the beat scheduler in this same worker process (runs
    # cleanup_stale_uploads hourly - see celery_tasks.py's beat_schedule)
    # rather than needing a whole separate always-on beat service/container
    # just for one periodic task.
    command: celery -A app.tasks.celery_tasks worker -B --loglevel=info

  # Celery Flower (Monitoring)
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5555:5555"
    # Same as backend/celery_worker: celery_tasks.py imports app.config.settings,
    # which requires SECRET_KEY/SUPER_ADMIN_PASSWORD with no defaults - without
    # this, flower fails Pydantic validation and exits immediately on startup.
    env_file:
      - ./backend/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis
    command: celery -A app.tasks.celery_tasks flower --port=5555

  # Frontend (Vite/React, built to static files and served by nginx -
  # see frontend/Dockerfile; no build-time API URL needed since the app
  # calls relative /api/... paths proxied by the outer nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # Nginx Reverse Proxy
  # Port 443/TLS intentionally not configured - terminate HTTPS upstream
  # (cloud load balancer, Cloudflare, etc.). See the deployment runbook.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      flower:
        condition: service_started
    command: nginx -g 'daemon off;'

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    driver: bridge
