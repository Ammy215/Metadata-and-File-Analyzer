services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fileshield}
      POSTGRES_USER: ${POSTGRES_USER:-fileshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fileshield}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  # Background analysis runs as FastAPI BackgroundTasks in this same
  # process (see backend/app/tasks/analysis_tasks.py) - no separate
  # Celery worker/Redis broker. That combination was built and tested
  # earlier, but free-tier hosting (Render) has no free tier for
  # always-on background workers, only Web Services/Static Sites/
  # Postgres/Key-Value - so it was replaced for the actual deployment
  # target. See analysis_tasks.py's start_periodic_sweep() docstring for
  # the full reasoning and what it trades away.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    # SECRET_KEY, SUPER_ADMIN_PASSWORD, CORS_ORIGINS etc. come from here -
    # required now (no insecure defaults in config.py), and .dockerignore
    # already keeps this file out of the built image itself.
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fileshield}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-fileshield}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # No curl/wget in this image - urllib is stdlib, needs no extra install.
    # Lets frontend/nginx below wait for the backend to actually be ready
    # to serve requests, not just for its container to have started -
    # confirmed empirically that without this, there's a several-second
    # window after a fresh boot where nginx is up and serving the frontend
    # but every API call 502s because the backend isn't listening yet.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Frontend (Vite/React, built to static files and served by nginx -
  # see frontend/Dockerfile; no build-time API URL needed since the app
  # calls relative /api/... paths proxied by the outer nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # Nginx Reverse Proxy
  # Port 443/TLS intentionally not configured - terminate HTTPS upstream
  # (cloud load balancer, Cloudflare, etc.). See the deployment runbook.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    command: nginx -g 'daemon off;'

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
