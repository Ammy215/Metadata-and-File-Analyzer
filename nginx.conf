events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:8000;
    }

    # Frontend container serves the built Vite static files via its own
    # internal nginx on port 80 (see frontend/Dockerfile) - not port 3000,
    # which was left over from when this targeted a Next.js dev server.
    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;
        # Must be >= the largest per-type limit FileValidator enforces
        # (2 GB for video/archives - see backend/app/utils/file_validator.py)
        # or nginx silently 413s those uploads before the backend ever sees
        # them, making an entire explicitly-supported file category
        # unusable in production.
        client_max_body_size 2048M;

        # TLS is intentionally not configured here - terminate it upstream
        # (a cloud load balancer, Cloudflare, etc.) rather than managing
        # certs inside this stack. See the deployment runbook.

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend health check - exposed at the top level (not under /api/)
        # so external monitoring/load balancers can probe it directly.
        location = /health {
            proxy_pass http://backend/health;
            proxy_set_header Host $host;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}
