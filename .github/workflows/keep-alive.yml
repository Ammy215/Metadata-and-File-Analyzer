# Daily keep-alive ping for the deployed app.
#
# Why this exists: Render's free tier spins the backend down after ~15min
# idle (a ~50s cold start on the next request), and Supabase's free tier
# auto-pauses a project after 7 days with zero database activity (manual
# dashboard restore, not automatic - see the Sep 2026 Neon outage this
# replaced). A daily ping is enough margin against the 7-day pause without
# reintroducing the mistake that caused that outage: pinging too often
# against a *metered* database. Supabase isn't metered by compute-hours,
# so daily-not-15-minutes here is purely "don't ping more than needed",
# not a cost constraint like it was on Neon.
#
# Hits /health specifically, not / - only /health actually queries the
# database (a real SELECT 1), which is what resets Supabase's inactivity
# clock. Pinging / would keep Render awake while Supabase quietly drifts
# toward its pause, same mistake as before just on a different provider.
#
# IMPORTANT - GitHub disables scheduled workflows automatically after
# ~60 days with no repository activity (commits, pushes, etc. all count -
# manual workflow runs do NOT reset this clock). A quiet portfolio repo
# can hit that silently, and this stops firing with no alert. If a demo
# reveals the site is cold/paused, check whether this workflow shows as
# disabled under the repo's Actions tab and manually re-enable it there.

name: Keep Alive

on:
  schedule:
    # 06:17 UTC daily - off the hour on purpose, GitHub recommends avoiding
    # round times since that's when scheduled-workflow load (and delay) is
    # highest across all of GitHub.
    - cron: '17 6 * * *'
  # Lets a warm-up be triggered manually from the Actions tab before a
  # demo/interview, instead of waiting on the schedule or eating a cold
  # start live.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          set -e

          URL="https://metadata-and-file-analyzer.onrender.com/health"
          # Render/Cloudflare-fronted services are known to silently drop
          # requests from generic/known-bot user agents on cold wake -
          # identifying honestly as a named, linkable client avoids that.
          UA="FileShield-KeepAlive/1.0 (+https://github.com/${{ github.repository }})"

          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            --max-time 60 \
            -A "$UA" \
            "$URL")

          echo "HTTP status: $http_code"
          echo "Response body:"
          cat response.json
          echo

          if [ "$http_code" != "200" ]; then
            echo "::error::Health check returned HTTP $http_code, expected 200"
            exit 1
          fi

          reported_status=$(python3 -c "import json; print(json.load(open('response.json')).get('status', ''))")
          echo "Reported status: $reported_status"

          if [ "$reported_status" != "healthy" ]; then
            echo "::warning::Backend responded 200 but status='$reported_status' (expected 'healthy') - database may be unreachable"
          fi
