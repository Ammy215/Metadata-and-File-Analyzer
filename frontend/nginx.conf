server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: React Router handles routing client-side, so any path
    # that isn't a real static asset (direct navigation, bookmark, page
    # refresh on e.g. /dashboard or /statistics) must still serve
    # index.html and let the client-side router take over - without this,
    # every route except "/" 404s outside of Vite's dev server (which
    # provides this fallback automatically, masking the gap locally).
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
